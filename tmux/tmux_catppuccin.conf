set -g @continuum-restore 'on'
set -g @catppuccin-flavor "macchiato"
set -g status-right "#{E:@catppuccin_status_application}"
# -ag (no -F): keep a live #{E:...} reference so the values refresh every
# status-interval. -F would expand (inline) the module content at set-time
# and freeze the numbers at the first sample.
set -ag status-right "#{E:@catppuccin_status_cpu_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_disk}"
set -g status-right-length 200
set -g status-left ""
set -ag status-left "[#S] "
